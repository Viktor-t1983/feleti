# Mosquitto MQTT broker — конфигурация для FELETI-SMOK

listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

allow_anonymous false
password_file /mosquitto/config/passwd

# ACL: камеры публикуют в telemetry/<chamber_id>, бэкенд подписывается
acl_file /mosquitto/config/acl

# Ограничение по пользователям
max_connections 100
max_queued_messages 1000
max_inflight_messages 50

# QoS по умолчанию
max_qos 2

# Retain для последних значений телеметрии
retain_available true

# TLS (в проде, опционально)
# listener 8883
# protocol mqtt
# certfile /mosquitto/config/server.crt
# keyfile /mosquitto/config/server.key
