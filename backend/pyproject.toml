[project]
name = "feleti-smok-backend"
version = "0.1.0"
description = "FELETI-SMOK — backend (FastAPI + SQLAlchemy + Alembic)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.3",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.20",
    "redis==5.2.0",
    "celery==5.4.0",
    "python-socketio==5.12.1",
    "httpx==0.28.1",
    "aiocache==0.12.3",
    "reportlab==4.2.5",
    "Pillow==11.0.0",
    "numpy==2.2.0",
    "pandas==2.2.3",
    "loguru==0.7.3",
    "pymodbus==3.7.4",
    "orjson==3.10.12",
    "telethon>=1.34.0",
    # Knowledge Pipeline
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "parsel==1.10.0",
    "pdfplumber==0.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "black==24.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
