version: "3.9"

# ============================================================
# FELETI-SMOK — docker-compose
# Поднимает: PostgreSQL, Redis, Mosquitto (MQTT), MinIO,
#            Backend (FastAPI), Frontend (Next.js), Adminer
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: feleti_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: feleti_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: feleti_mosquitto
    restart: unless-stopped
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
      - ./nginx/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"      # MQTT
      - "9001:9001"      # WebSockets
    environment:
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "sh", "-c", "mosquitto_pub -h localhost -t test/health -m ping || true"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feleti_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/uploads
    ports:
      - "8000:8000"
    command: >
      bash -c "
        alembic upgrade head &&
        python -m app.scripts.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     args:
  #       NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  #       NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
  #   container_name: feleti_frontend
  #   restart: unless-stopped
  #   env_file: .env
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   ports:
  #     - "3000:3000"
  #   command: npm run dev

  adminer:
    image: adminer:4.8.1
    container_name: feleti_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  minio:
    image: minio/minio:latest
    container_name: feleti_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9002"
    command: server /data --console-address ":9002"

networks:
  default:
    name: feleti-net

configs:
  mosquitto_config:
    file: ./nginx/mosquitto.conf
  # mosquitto_passwd:
  #   file: ./nginx/mosquitto.passwd
